name: 每日微博热搜报告

on:
  schedule:
    # 每天北京时间 08:00 运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取微博热搜并生成报告
        run: python weibo_hot_cloud.py

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传报告产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
